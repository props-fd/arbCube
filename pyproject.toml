[project]
name = "arbcube"
version = "0.1.0"
description = "GNN trained on CFOP 3x3 solutions applied to arbitrary cubes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=1.0.3",
    "pandas>=3.1.1",
]

[tool.uv]
package = false

[tool.marimo.runtime]
pythonpath = ["."]

[dependency-groups]
dev = [
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "tokenizers>=0.23.3",
]
